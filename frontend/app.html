<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RunPilot — Generate Runbooks</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0a;
      --bg2: #111111;
      --bg3: #181818;
      --bg4: #1f1f1f;
      --green: #4ade80;
      --green2: #22c55e;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.05);
      --text: #f0f0f0;
      --muted: #888;
      --muted2: #555;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; font-weight: 400; }

    /* NAV */
    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 2rem; border-bottom: 1px solid var(--border2);
      background: rgba(10,10,10,0.95); backdrop-filter: blur(20px);
      position: sticky; top: 0; z-index: 100; flex-shrink: 0;
    }
    .nav-left { display: flex; align-items: center; gap: 14px; }
    .nav-logo { font-size: 17px; font-weight: 600; color: var(--text); text-decoration: none; letter-spacing: -0.3px; }
    .nav-logo span { color: var(--green); }
    .nav-badge { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--green); background: rgba(74,222,128,0.1); padding: 3px 8px; border-radius: 4px; border: 1px solid rgba(74,222,128,0.2); }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .nav-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
    .nav-link { font-size: 13px; color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .nav-link:hover { color: var(--text); }

    /* APP BODY */
    .app-body { display: flex; flex: 1; min-height: 0; height: calc(100vh - 57px); }

    /* SIDEBAR */
    .sidebar {
      width: 300px; flex-shrink: 0; border-right: 1px solid var(--border);
      display: flex; flex-direction: column; background: var(--bg2);
      overflow: hidden;
    }

    .sidebar-header { padding: 1.25rem; border-bottom: 1px solid var(--border); }
    .sidebar-title { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted2); margin-bottom: 0.75rem; }

    .input-row { display: flex; gap: 8px; }
    .project-input {
      flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; color: var(--text); font-size: 13px;
      font-family: 'JetBrains Mono', monospace; font-weight: 500; outline: none;
      transition: border-color 0.2s; letter-spacing: 0.05em;
    }
    .project-input:focus { border-color: rgba(74,222,128,0.4); }
    .project-input::placeholder { color: var(--muted2); font-family: 'Inter', sans-serif; font-weight: 400; font-size: 12px; letter-spacing: 0; }

    .fetch-btn {
      background: var(--green); color: #0a0a0a; border: none; border-radius: 8px;
      padding: 10px 14px; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; white-space: nowrap;
    }
    .fetch-btn:hover { background: var(--green2); }
    .fetch-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* TICKETS */
    .tickets-wrap { flex: 1; overflow-y: auto; }
    .tickets-wrap::-webkit-scrollbar { width: 3px; }
    .tickets-wrap::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }

    .tickets-count { padding: 0.75rem 1.25rem; font-size: 11px; color: var(--muted2); letter-spacing: 0.04em; border-bottom: 1px solid var(--border2); }

    .ticket-item {
      padding: 0.9rem 1.25rem; border-bottom: 1px solid var(--border2);
      cursor: pointer; transition: background 0.15s; position: relative;
    }
    .ticket-item:hover { background: var(--bg3); }
    .ticket-item.selected { background: rgba(74,222,128,0.05); border-left: 2px solid var(--green); padding-left: calc(1.25rem - 2px); }

    .t-key { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--green); font-weight: 500; margin-bottom: 4px; letter-spacing: 0.05em; }
    .t-title { font-size: 12px; color: var(--text); line-height: 1.4; margin-bottom: 5px; font-weight: 400; }
    .t-status { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; color: var(--green); text-transform: uppercase; letter-spacing: 0.06em; }
    .t-status::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--green); }

    .empty-tickets { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3rem 1.5rem; text-align: center; gap: 0.5rem; height: 100%; }
    .empty-icon-text { font-size: 32px; color: var(--muted2); line-height: 1; margin-bottom: 0.5rem; }
    .empty-title { font-size: 13px; color: var(--muted); font-weight: 400; }
    .empty-sub { font-size: 12px; color: var(--muted2); line-height: 1.5; }

    .skeleton { background: linear-gradient(90deg, var(--bg3) 25%, var(--bg4) 50%, var(--bg3) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 3px; }
    @keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

    .sidebar-footer { padding: 0.875rem 1.25rem; border-top: 1px solid var(--border); }
    .gen-all-btn {
      width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px; font-size: 12px; font-weight: 500; color: var(--muted);
      cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; letter-spacing: 0.02em;
    }
    .gen-all-btn:hover { background: var(--bg4); color: var(--text); border-color: rgba(255,255,255,0.12); }
    .gen-all-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* MAIN */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .main-toolbar {
      padding: 1rem 1.5rem; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      flex-shrink: 0; flex-wrap: wrap;
    }

    .ticket-info { flex: 1; min-width: 0; }
    .ticket-info-label { font-size: 10px; color: var(--muted2); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 2px; }
    .ticket-info-title { font-size: 14px; color: var(--text); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.1px; }
    .ticket-info-placeholder { font-size: 13px; color: var(--muted2); font-style: italic; }

    .toolbar-btns { display: flex; gap: 8px; }
    .t-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
      cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s;
      border: 1px solid var(--border); background: var(--bg2); color: var(--muted);
    }
    .t-btn:hover { background: var(--bg3); color: var(--text); }
    .t-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .t-btn.primary { background: var(--green); color: #0a0a0a; border-color: transparent; font-weight: 600; }
    .t-btn.primary:hover { background: var(--green2); box-shadow: 0 6px 20px rgba(74,222,128,0.2); }
    .t-btn.primary:disabled { opacity: 0.5; box-shadow: none; }

    /* OUTPUT */
    .output { flex: 1; overflow-y: auto; padding: 2rem; }
    .output::-webkit-scrollbar { width: 4px; }
    .output::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }

    .placeholder-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 400px; text-align: center; gap: 0.75rem; }
    .placeholder-big { font-size: 48px; color: var(--bg4); font-weight: 600; line-height: 1; }
    .placeholder-title { font-size: 16px; font-weight: 500; color: var(--muted); }
    .placeholder-sub { font-size: 13px; color: var(--muted2); max-width: 280px; line-height: 1.6; font-weight: 300; }

    /* RUNBOOK DISPLAY */
    .runbook-wrap { max-width: 800px; margin: 0 auto; }

    .runbook-top {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 1rem; margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border);
    }
    .rb-meta {}
    .rb-key { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--green); font-weight: 500; margin-bottom: 5px; letter-spacing: 0.05em; }
    .rb-title { font-size: 22px; font-weight: 600; color: var(--text); letter-spacing: -0.5px; line-height: 1.2; }

    .rb-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .rb-action-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 500; padding: 7px 14px; border-radius: 7px;
      cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s;
      border: 1px solid var(--border); background: var(--bg2); color: var(--muted);
      text-decoration: none; white-space: nowrap;
    }
    .rb-action-btn:hover { background: var(--bg3); color: var(--text); }
    .rb-action-btn.green { color: var(--green); border-color: rgba(74,222,128,0.2); background: rgba(74,222,128,0.05); }
    .rb-action-btn.green:hover { background: rgba(74,222,128,0.1); }

    .runbook-body {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
      padding: 1.75rem; font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
      line-height: 1.85; color: #c9d1d9; white-space: pre-wrap;
      max-height: 550px; overflow-y: auto;
    }
    .runbook-body::-webkit-scrollbar { width: 3px; }
    .runbook-body::-webkit-scrollbar-thumb { background: var(--bg4); }

    .runbook-footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid var(--border);
    }
    .rb-saved { font-size: 11px; color: var(--muted2); font-family: 'JetBrains Mono', monospace; }
    .rb-time { font-size: 11px; color: var(--muted2); }

    /* LOADING */
    .loading-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 400px; gap: 1.25rem; }
    .loading-spinner { width: 32px; height: 32px; border: 2px solid var(--bg4); border-top-color: var(--green); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg);} }
    .loading-text { font-size: 14px; color: var(--muted); }
    .loading-sub { font-size: 12px; color: var(--muted2); }

    /* STATUS */
    .status-bar {
      padding: 0.5rem 1.5rem; border-top: 1px solid var(--border2);
      font-size: 12px; color: var(--muted2); flex-shrink: 0; min-height: 32px;
      display: flex; align-items: center;
    }
    .status-bar.ok { color: var(--green); }
    .status-bar.err { color: #f87171; }

    /* TOAST */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 10px; padding: 11px 16px; font-size: 13px;
      display: flex; align-items: center; gap: 10px; z-index: 1000;
      transform: translateY(60px); opacity: 0; transition: all 0.3s;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4); max-width: 300px;
    }
    .toast.show { transform: none; opacity: 1; }

    @media(max-width:768px){
      .app-body{flex-direction:column;}
      .sidebar{width:100%;height:320px;}
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-left">
    <a href="landing.html" class="nav-logo">Run<span>Pilot</span></a>
    <span class="nav-badge">Beta</span>
  </div>
  <div class="nav-right">
    <div class="nav-status"><div class="status-dot"></div>API live</div>
    <a href="landing.html" class="nav-link">← Home</a>
  </div>
</nav>

<div class="app-body">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Jira project key</div>
      <div class="input-row">
        <input type="text" id="projectKey" class="project-input" placeholder="Enter key e.g. PROJ"/>
        <button class="fetch-btn" onclick="loadTickets()" id="fetchBtn">Fetch</button>
      </div>
    </div>

    <div class="tickets-wrap" id="ticketsWrap">
      <div class="empty-tickets">
        <div class="empty-icon-text">—</div>
        <div class="empty-title">No project loaded</div>
        <div class="empty-sub">Enter your Jira project key above and click Fetch</div>
      </div>
    </div>

    <div class="sidebar-footer">
      <button class="gen-all-btn" onclick="generateAll()" id="genAllBtn">⚡ Generate all incident runbooks</button>
    </div>
  </div>

  <!-- MAIN PANEL -->
  <div class="main">
    <div class="main-toolbar">
      <div class="ticket-info" id="ticketInfo">
        <div class="ticket-info-placeholder">← Select a ticket to generate its runbook</div>
      </div>
      <div class="toolbar-btns">
        <button class="t-btn" onclick="copyRunbook()" id="copyBtn" disabled>Copy</button>
        <button class="t-btn primary" onclick="generateRunbook()" id="generateBtn" disabled>✨ Generate runbook</button>
      </div>
    </div>

    <div class="output" id="output">
      <div class="placeholder-wrap">
        <div class="placeholder-big">✦</div>
        <div class="placeholder-title">No runbook generated yet</div>
        <div class="placeholder-sub">Select a ticket from the sidebar and click Generate runbook</div>
      </div>
    </div>

    <div class="status-bar" id="statusBar">Ready</div>
  </div>

</div>

<div class="toast" id="toast">
  <span id="toastIcon">✓</span>
  <span id="toastMsg">Done</span>
</div>

<script>
  const API = 'http://35.154.77.254:8000'
  let selectedTicket = null
  let currentRunbook = ''

  async function loadTickets() {
    const key = document.getElementById('projectKey').value.trim().toUpperCase()
    if (!key) return
    const wrap = document.getElementById('ticketsWrap')
    document.getElementById('fetchBtn').disabled = true
    setStatus('Fetching tickets...', '')

    wrap.innerHTML = '<div style="padding:1rem">' +
      [1,2,3,4,5].map(() => `
        <div style="padding:0.75rem 0;border-bottom:1px solid rgba(255,255,255,0.04);">
          <div class="skeleton" style="height:9px;width:55px;margin-bottom:7px;"></div>
          <div class="skeleton" style="height:11px;width:88%;margin-bottom:4px;"></div>
          <div class="skeleton" style="height:11px;width:65%;"></div>
        </div>
      `).join('') + '</div>'

    try {
      const res = await fetch(`${API}/tickets/${key}`)
      if (!res.ok) throw new Error()
      const data = await res.json()

      if (!data.tickets?.length) {
        wrap.innerHTML = `<div class="empty-tickets"><div class="empty-icon-text">—</div><div class="empty-title">No tickets found</div><div class="empty-sub">No tickets in project ${key}</div></div>`
        setStatus('No tickets found', '')
        return
      }

      wrap.innerHTML = `<div class="tickets-count">${data.count} tickets · ${key}</div>`
      data.tickets.forEach(t => {
        const el = document.createElement('div')
        el.className = 'ticket-item'
        el.id = `t-${t.key}`
        el.innerHTML = `<div class="t-key">${t.key}</div><div class="t-title">${t.summary}</div><span class="t-status">${t.status}</span>`
        el.onclick = () => selectTicket(t)
        wrap.appendChild(el)
      })
      setStatus(`${data.count} tickets loaded`, 'ok')

    } catch {
      wrap.innerHTML = `<div class="empty-tickets"><div class="empty-icon-text">!</div><div class="empty-title">Connection error</div><div class="empty-sub">Could not reach the API server</div></div>`
      setStatus('Connection error', 'err')
    } finally {
      document.getElementById('fetchBtn').disabled = false
    }
  }

  function selectTicket(ticket) {
    selectedTicket = ticket
    document.querySelectorAll('.ticket-item').forEach(el => el.classList.remove('selected'))
    const el = document.getElementById(`t-${ticket.key}`)
    if (el) { el.classList.add('selected'); el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }) }
    document.getElementById('ticketInfo').innerHTML = `
      <div class="ticket-info-label">Selected ticket</div>
      <div class="ticket-info-title">${ticket.key} — ${ticket.summary}</div>
    `
    document.getElementById('generateBtn').disabled = false
    setStatus(`${ticket.key} selected`, '')
  }

  async function generateRunbook() {
    if (!selectedTicket) return
    const key = document.getElementById('projectKey').value.trim().toUpperCase()
    document.getElementById('generateBtn').disabled = true
    document.getElementById('copyBtn').disabled = true
    setStatus('Generating with AI...', '')
    showLoading(`Generating runbook for ${selectedTicket.key}`, '~10–15 seconds')

    try {
      const res = await fetch(`${API}/generate-and-sync/${key}/${selectedTicket.key}`, { method: 'POST' })
      if (!res.ok) throw new Error()
      const data = await res.json()
      currentRunbook = data.runbook
      showRunbook(data)
      setStatus('Runbook generated and synced to Confluence ✓', 'ok')
      showToast('✓', 'Generated and synced to Confluence!')
    } catch {
      setStatus('Generation failed. Please try again.', 'err')
      showToast('✗', 'Error generating runbook')
      document.getElementById('output').innerHTML = `<div class="placeholder-wrap"><div class="placeholder-big">✗</div><div class="placeholder-title">Generation failed</div><div class="placeholder-sub">Please try again or check your server connection.</div></div>`
    } finally {
      document.getElementById('generateBtn').disabled = false
    }
  }

  async function generateAll() {
    const key = document.getElementById('projectKey').value.trim().toUpperCase()
    if (!key) { showToast('—', 'Enter a project key first'); return }
    document.getElementById('genAllBtn').disabled = true
    setStatus('Generating all incident runbooks...', '')
    showLoading('Generating all incident runbooks', 'This may take 30–60 seconds')

    try {
      const res = await fetch(`${API}/generate-all/${key}`, { method: 'POST' })
      if (!res.ok) throw new Error()
      const data = await res.json()
      if (data.runbooks?.length) {
        currentRunbook = data.runbooks[0].runbook
        showRunbook({ ...data.runbooks[0], saved_to: data.saved_files?.[0] })
        setStatus(`${data.generated} runbooks generated ✓`, 'ok')
        showToast('✓', `${data.generated} runbooks generated!`)
      }
    } catch {
      setStatus('Error generating runbooks', 'err')
      showToast('✗', 'Error generating runbooks')
    } finally {
      document.getElementById('genAllBtn').disabled = false
    }
  }

  function showLoading(text, sub) {
    document.getElementById('output').innerHTML = `
      <div class="loading-wrap">
        <div class="loading-spinner"></div>
        <div class="loading-text">${text}...</div>
        <div class="loading-sub">${sub}</div>
      </div>
    `
  }

  function showRunbook(data) {
    const confluenceBtn = data.confluence_url
      ? `<a href="${data.confluence_url}" target="_blank" class="rb-action-btn green">View in Confluence →</a>` : ''

    document.getElementById('output').innerHTML = `
      <div class="runbook-wrap">
        <div class="runbook-top">
          <div class="rb-meta">
            <div class="rb-key">${data.ticket_key}</div>
            <div class="rb-title">${data.ticket_title}</div>
          </div>
          <div class="rb-actions">
            ${confluenceBtn}
            <button class="rb-action-btn" onclick="copyRunbook()">Copy</button>
          </div>
        </div>
        <div class="runbook-body">${escapeHtml(data.runbook)}</div>
        <div class="runbook-footer">
          <div class="rb-saved">${data.saved_to || 'Generated successfully'}</div>
          <div class="rb-time">${new Date().toLocaleString()}</div>
        </div>
      </div>
    `
    document.getElementById('copyBtn').disabled = false
  }

  function escapeHtml(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  }

  function copyRunbook() {
    if (!currentRunbook) return
    navigator.clipboard.writeText(currentRunbook).then(() => showToast('⎘', 'Copied to clipboard'))
  }

  function setStatus(msg, type) {
    const el = document.getElementById('statusBar')
    el.className = `status-bar ${type}`
    el.textContent = msg
  }

  function showToast(icon, msg) {
    document.getElementById('toastIcon').textContent = icon
    document.getElementById('toastMsg').textContent = msg
    const t = document.getElementById('toast')
    t.classList.add('show')
    setTimeout(() => t.classList.remove('show'), 3500)
  }

  document.getElementById('projectKey').addEventListener('keypress', e => {
    if (e.key === 'Enter') loadTickets()
  })
</script>
</body>
</html>
