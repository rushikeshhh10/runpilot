<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RunPilot — Generate Runbooks</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --cream: #F5F0E8;
      --cream2: #EDE8DE;
      --cream3: #E5DFD3;
      --ink: #1A1814;
      --ink2: #2D2A25;
      --ink3: #6B6560;
      --ink4: #9B9590;
      --gold: #C9A96E;
      --gold2: #B8934A;
      --border: rgba(26,24,20,0.1);
      --border2: rgba(26,24,20,0.06);
      --green: #2D6A4F;
      --green-bg: rgba(45,106,79,0.06);
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; font-weight: 300; display: flex; flex-direction: column; }

    /* NAV */
    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 2.5rem; border-bottom: 1px solid var(--border);
      background: rgba(245,240,232,0.95); backdrop-filter: blur(20px);
      position: sticky; top: 0; z-index: 100; flex-shrink: 0;
    }
    .nav-left { display: flex; align-items: center; gap: 20px; }
    .nav-logo { font-family: 'Instrument Serif', serif; font-size: 20px; color: var(--ink); text-decoration: none; letter-spacing: -0.3px; }
    .nav-logo em { font-style: italic; color: var(--gold2); }
    .nav-badge { font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold2); background: rgba(184,147,74,0.1); padding: 3px 8px; border-radius: 2px; border: 1px solid rgba(184,147,74,0.2); }
    .nav-right { display: flex; align-items: center; gap: 20px; }
    .nav-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink4); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
    .nav-link { font-size: 13px; color: var(--ink3); text-decoration: none; transition: color 0.2s; }
    .nav-link:hover { color: var(--ink); }

    /* LAYOUT */
    .app-body { display: flex; flex: 1; min-height: 0; }

    /* SIDEBAR */
    .sidebar {
      width: 320px; flex-shrink: 0; border-right: 1px solid var(--border);
      display: flex; flex-direction: column; background: var(--cream);
      height: calc(100vh - 57px); position: sticky; top: 57px; overflow: hidden;
    }

    .sidebar-top { padding: 1.5rem; border-bottom: 1px solid var(--border); }
    .sidebar-label { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink4); margin-bottom: 0.75rem; }

    .input-group { display: flex; gap: 8px; }
    .project-input {
      flex: 1; background: var(--cream2); border: 1px solid var(--border);
      border-radius: 3px; padding: 10px 14px; color: var(--ink);
      font-size: 13px; font-family: 'JetBrains Mono', monospace; font-weight: 500;
      outline: none; transition: border-color 0.2s; letter-spacing: 0.06em;
    }
    .project-input:focus { border-color: rgba(184,147,74,0.4); background: var(--cream); }
    .project-input::placeholder { color: var(--ink4); font-weight: 400; letter-spacing: 0; font-family: 'Inter', sans-serif; }

    .fetch-btn {
      background: var(--ink); color: var(--cream); border: none; border-radius: 3px;
      padding: 10px 16px; font-size: 13px; font-weight: 400; letter-spacing: 0.04em;
      cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; white-space: nowrap;
    }
    .fetch-btn:hover { background: var(--ink2); }
    .fetch-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .tickets-list { flex: 1; overflow-y: auto; }
    .tickets-list::-webkit-scrollbar { width: 3px; }
    .tickets-list::-webkit-scrollbar-thumb { background: var(--cream3); border-radius: 2px; }

    .tickets-meta { padding: 1rem 1.5rem 0.5rem; font-size: 11px; color: var(--ink4); letter-spacing: 0.04em; }

    .ticket-item {
      padding: 1rem 1.5rem; border-bottom: 1px solid var(--border2);
      cursor: pointer; transition: background 0.15s; position: relative;
    }
    .ticket-item:hover { background: var(--cream2); }
    .ticket-item.selected { background: var(--cream2); }
    .ticket-item.selected::after { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 2px; background: var(--gold2); }

    .ticket-key { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--gold2); font-weight: 500; margin-bottom: 5px; letter-spacing: 0.06em; }
    .ticket-title { font-size: 13px; color: var(--ink); line-height: 1.4; margin-bottom: 6px; font-weight: 400; }
    .ticket-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--green); }
    .ticket-badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--green); }

    .sidebar-bottom { padding: 1rem 1.5rem; border-top: 1px solid var(--border); }
    .generate-all-btn {
      width: 100%; background: transparent; border: 1px solid var(--border);
      border-radius: 3px; padding: 10px; font-size: 13px; font-weight: 400;
      color: var(--ink3); cursor: pointer; font-family: 'Inter', sans-serif;
      transition: all 0.2s; letter-spacing: 0.02em;
    }
    .generate-all-btn:hover { background: var(--cream2); color: var(--ink); border-color: rgba(26,24,20,0.2); }
    .generate-all-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* EMPTY STATE */
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3rem 2rem; text-align: center; height: 100%; gap: 0.75rem; }
    .empty-icon { font-family: 'Instrument Serif', serif; font-size: 48px; color: var(--cream3); font-weight: 400; }
    .empty-title { font-size: 14px; color: var(--ink3); font-weight: 400; }
    .empty-sub { font-size: 12px; color: var(--ink4); line-height: 1.6; max-width: 200px; }

    /* SKELETON */
    .skeleton { background: linear-gradient(90deg, var(--cream2) 25%, var(--cream3) 50%, var(--cream2) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 2px; }
    @keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

    /* MAIN */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    .main-header {
      padding: 1.25rem 2rem; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap;
    }

    .selected-info { flex: 1; min-width: 0; }
    .selected-eyebrow { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink4); margin-bottom: 3px; }
    .selected-title-text { font-size: 15px; font-weight: 400; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.2px; }
    .selected-placeholder { font-size: 14px; color: var(--ink4); font-style: italic; font-family: 'Instrument Serif', serif; }

    .header-actions { display: flex; gap: 8px; align-items: center; }

    .action-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 18px; border-radius: 3px; font-size: 13px; font-weight: 400;
      letter-spacing: 0.04em; cursor: pointer; font-family: 'Inter', sans-serif;
      transition: all 0.2s; border: 1px solid var(--border); background: transparent; color: var(--ink3);
    }
    .action-btn:hover { background: var(--cream2); color: var(--ink); }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .action-btn.primary { background: var(--ink); color: var(--cream); border-color: transparent; }
    .action-btn.primary:hover { background: var(--ink2); }
    .action-btn.primary:disabled { opacity: 0.4; }

    /* OUTPUT */
    .output { flex: 1; overflow-y: auto; padding: 2.5rem; }
    .output::-webkit-scrollbar { width: 3px; }
    .output::-webkit-scrollbar-thumb { background: var(--cream3); }

    .output-placeholder {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 400px; text-align: center; gap: 1rem;
    }
    .placeholder-serif { font-family: 'Instrument Serif', serif; font-size: 52px; color: var(--cream3); font-weight: 400; line-height: 1; }
    .placeholder-title { font-size: 16px; font-weight: 400; color: var(--ink3); }
    .placeholder-sub { font-size: 13px; color: var(--ink4); max-width: 280px; line-height: 1.6; font-weight: 300; }

    /* RUNBOOK CARD */
    .runbook-card { max-width: 820px; margin: 0 auto; }

    .runbook-card-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 1.5rem; margin-bottom: 1.5rem; padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .runbook-card-meta {}
    .runbook-card-key { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--gold2); font-weight: 500; margin-bottom: 6px; letter-spacing: 0.06em; }
    .runbook-card-title { font-family: 'Instrument Serif', serif; font-size: 28px; font-weight: 400; color: var(--ink); letter-spacing: -0.5px; line-height: 1.2; }

    .runbook-card-actions { display: flex; gap: 8px; flex-shrink: 0; align-items: flex-start; }

    .confluence-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 400; letter-spacing: 0.04em;
      color: var(--gold2); text-decoration: none; padding: 7px 14px; border-radius: 3px;
      border: 1px solid rgba(184,147,74,0.3); background: rgba(184,147,74,0.05);
      transition: all 0.2s; white-space: nowrap;
    }
    .confluence-btn:hover { background: rgba(184,147,74,0.1); border-color: rgba(184,147,74,0.4); }

    .icon-btn {
      width: 32px; height: 32px; border-radius: 3px; background: var(--cream2);
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 13px; transition: all 0.2s;
    }
    .icon-btn:hover { background: var(--cream3); }

    .runbook-content {
      font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
      line-height: 1.9; color: var(--ink2); white-space: pre-wrap;
      background: var(--cream2); border: 1px solid var(--border);
      border-radius: 3px; padding: 2rem; max-height: 580px; overflow-y: auto;
    }
    .runbook-content::-webkit-scrollbar { width: 3px; }
    .runbook-content::-webkit-scrollbar-thumb { background: var(--cream3); }

    .runbook-footer-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border);
    }
    .runbook-saved { font-size: 11px; color: var(--ink4); font-family: 'JetBrains Mono', monospace; }
    .runbook-time { font-size: 11px; color: var(--ink4); }

    /* LOADING */
    .loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 400px; gap: 1.5rem; }
    .loading-serif { font-family: 'Instrument Serif', serif; font-size: 20px; font-weight: 400; color: var(--ink3); font-style: italic; }
    .loading-bar { width: 120px; height: 1px; background: var(--cream3); position: relative; overflow: hidden; }
    .loading-bar::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, var(--gold2), transparent); animation: loadingSlide 1.5s ease infinite; }
    @keyframes loadingSlide { 0%{left:-100%;} 100%{left:100%;} }
    .loading-sub { font-size: 12px; color: var(--ink4); letter-spacing: 0.04em; }

    /* STATUS */
    .status-bar {
      padding: 0.6rem 2rem; border-top: 1px solid var(--border2);
      font-size: 12px; color: var(--ink4); display: flex; align-items: center; gap: 8px;
      background: var(--cream); flex-shrink: 0; min-height: 34px;
    }
    .status-bar.success { color: var(--green); }
    .status-bar.error { color: #8B2020; }

    /* TOAST */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--ink); color: var(--cream);
      border-radius: 3px; padding: 12px 18px; font-size: 13px;
      display: flex; align-items: center; gap: 10px; z-index: 1000;
      transform: translateY(60px); opacity: 0; transition: all 0.3s;
      max-width: 300px; box-shadow: 0 20px 40px rgba(26,24,20,0.2);
    }
    .toast.show { transform: none; opacity: 1; }

    @media(max-width:768px){
      .app-body{flex-direction:column;}
      .sidebar{width:100%;height:auto;position:static;}
      .tickets-list{max-height:300px;}
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-left">
    <a href="landing.html" class="nav-logo">Run<em>Pilot</em></a>
    <span class="nav-badge">Beta</span>
  </div>
  <div class="nav-right">
    <div class="nav-status">
      <div class="status-dot"></div>
      <span>API live</span>
    </div>
    <a href="landing.html" class="nav-link">← Home</a>
  </div>
</nav>

<div class="app-body">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-label">Jira project key</div>
      <div class="input-group">
        <input type="text" id="projectKey" class="project-input" placeholder="e.g. PROJ"/>
        <button class="fetch-btn" onclick="loadTickets()" id="fetchBtn">Fetch →</button>
      </div>
    </div>

    <div class="tickets-list" id="ticketsList">
      <div class="empty-state">
        <div class="empty-icon">—</div>
        <div class="empty-title">No project loaded</div>
        <div class="empty-sub">Enter your Jira project key above to load tickets</div>
      </div>
    </div>

    <div class="sidebar-bottom">
      <button class="generate-all-btn" onclick="generateAll()" id="generateAllBtn">Generate all incident runbooks</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="main-header">
      <div class="selected-info" id="selectedInfo">
        <div class="selected-placeholder">Select a ticket to generate its runbook</div>
      </div>
      <div class="header-actions">
        <button class="action-btn" onclick="copyRunbook()" id="copyBtn" disabled>Copy</button>
        <button class="action-btn primary" onclick="generateRunbook()" id="generateBtn" disabled>Generate runbook →</button>
      </div>
    </div>

    <div class="output" id="output">
      <div class="output-placeholder">
        <div class="placeholder-serif">—</div>
        <div class="placeholder-title">No runbook generated yet</div>
        <div class="placeholder-sub">Select a ticket from the sidebar and click generate to get started</div>
      </div>
    </div>

    <div class="status-bar" id="statusBar">Ready</div>
  </div>

</div>

<div class="toast" id="toast">
  <span id="toastIcon">✓</span>
  <span id="toastMsg">Done</span>
</div>

<script>
  const API = 'http://35.154.77.254:8000'
  let selectedTicket = null
  let currentRunbook = ''

  async function loadTickets() {
    const key = document.getElementById('projectKey').value.trim().toUpperCase()
    if (!key) return
    const list = document.getElementById('ticketsList')
    document.getElementById('fetchBtn').disabled = true
    setStatus('Fetching tickets from Jira...', '')

    list.innerHTML = '<div style="padding:1.5rem;">' +
      [1,2,3,4,5].map(() => `
        <div style="padding:1rem 0;border-bottom:1px solid rgba(26,24,20,0.06);">
          <div class="skeleton" style="height:9px;width:50px;margin-bottom:8px;"></div>
          <div class="skeleton" style="height:12px;width:90%;margin-bottom:4px;"></div>
          <div class="skeleton" style="height:12px;width:70%;"></div>
        </div>
      `).join('') + '</div>'

    try {
      const res = await fetch(`${API}/tickets/${key}`)
      if (!res.ok) throw new Error()
      const data = await res.json()

      if (!data.tickets?.length) {
        list.innerHTML = `<div class="empty-state"><div class="empty-icon">—</div><div class="empty-title">No tickets found</div><div class="empty-sub">No tickets found in project ${key}</div></div>`
        setStatus('No tickets found', '')
        return
      }

      list.innerHTML = `<div class="tickets-meta">${data.count} tickets in ${key}</div>`

      data.tickets.forEach(ticket => {
        const el = document.createElement('div')
        el.className = 'ticket-item'
        el.id = `t-${ticket.key}`
        el.innerHTML = `
          <div class="ticket-key">${ticket.key}</div>
          <div class="ticket-title">${ticket.summary}</div>
          <span class="ticket-badge">${ticket.status}</span>
        `
        el.onclick = () => selectTicket(ticket)
        list.appendChild(el)
      })

      setStatus(`${data.count} tickets loaded from ${key}`, '')

    } catch {
      list.innerHTML = `<div class="empty-state"><div class="empty-icon">—</div><div class="empty-title">Connection error</div><div class="empty-sub">Could not reach the API. Check your server is running.</div></div>`
      setStatus('Error connecting to API', 'error')
    } finally {
      document.getElementById('fetchBtn').disabled = false
    }
  }

  function selectTicket(ticket) {
    selectedTicket = ticket
    document.querySelectorAll('.ticket-item').forEach(el => el.classList.remove('selected'))
    const el = document.getElementById(`t-${ticket.key}`)
    if (el) { el.classList.add('selected'); el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }) }

    document.getElementById('selectedInfo').innerHTML = `
      <div class="selected-eyebrow">Selected ticket</div>
      <div class="selected-title-text">${ticket.key} — ${ticket.summary}</div>
    `
    document.getElementById('generateBtn').disabled = false
    setStatus(`${ticket.key} selected`, '')
  }

  async function generateRunbook() {
    if (!selectedTicket) return
    const projectKey = document.getElementById('projectKey').value.trim().toUpperCase()
    document.getElementById('generateBtn').disabled = true
    document.getElementById('copyBtn').disabled = true
    setStatus('Generating runbook...', '')
    showLoading(`Generating runbook for ${selectedTicket.key}`, 'This takes about 10–15 seconds')

    try {
      const res = await fetch(`${API}/generate-and-sync/${projectKey}/${selectedTicket.key}`, { method: 'POST' })
      if (!res.ok) throw new Error()
      const data = await res.json()
      currentRunbook = data.runbook
      showRunbook(data)
      setStatus(`Runbook generated and synced to Confluence`, 'success')
      showToast('✓', 'Runbook generated and saved to Confluence')
    } catch {
      setStatus('Generation failed. Please try again.', 'error')
      showToast('✗', 'Error generating runbook')
      document.getElementById('output').innerHTML = `
        <div class="output-placeholder">
          <div class="placeholder-serif">—</div>
          <div class="placeholder-title">Generation failed</div>
          <div class="placeholder-sub">Could not generate runbook. Check your connection and try again.</div>
        </div>
      `
    } finally {
      document.getElementById('generateBtn').disabled = false
    }
  }

  async function generateAll() {
    const key = document.getElementById('projectKey').value.trim().toUpperCase()
    if (!key) { showToast('—', 'Enter a project key first'); return }
    document.getElementById('generateAllBtn').disabled = true
    setStatus('Generating all incident runbooks...', '')
    showLoading('Generating all incident runbooks', 'This may take 30–60 seconds')

    try {
      const res = await fetch(`${API}/generate-all/${key}`, { method: 'POST' })
      if (!res.ok) throw new Error()
      const data = await res.json()
      if (data.runbooks?.length) {
        currentRunbook = data.runbooks[0].runbook
        showRunbook({ ...data.runbooks[0], saved_to: data.saved_files?.[0] })
        setStatus(`${data.generated} runbooks generated successfully`, 'success')
        showToast('✓', `${data.generated} runbooks generated`)
      }
    } catch {
      setStatus('Error generating runbooks', 'error')
      showToast('✗', 'Error generating runbooks')
    } finally {
      document.getElementById('generateAllBtn').disabled = false
    }
  }

  function showLoading(text, sub) {
    document.getElementById('output').innerHTML = `
      <div class="loading-state">
        <div class="loading-serif">${text}...</div>
        <div class="loading-bar"></div>
        <div class="loading-sub">${sub}</div>
      </div>
    `
  }

  function showRunbook(data) {
    const confluenceBtn = data.confluence_url
      ? `<a href="${data.confluence_url}" target="_blank" class="confluence-btn">View in Confluence →</a>`
      : ''

    document.getElementById('output').innerHTML = `
      <div class="runbook-card">
        <div class="runbook-card-header">
          <div class="runbook-card-meta">
            <div class="runbook-card-key">${data.ticket_key}</div>
            <div class="runbook-card-title">${data.ticket_title}</div>
          </div>
          <div class="runbook-card-actions">
            ${confluenceBtn}
            <div class="icon-btn" onclick="copyRunbook()" title="Copy">⎘</div>
          </div>
        </div>
        <div class="runbook-content">${escapeHtml(data.runbook)}</div>
        <div class="runbook-footer-meta">
          <div class="runbook-saved">${data.saved_to || 'Generated successfully'}</div>
          <div class="runbook-time">${new Date().toLocaleString()}</div>
        </div>
      </div>
    `
    document.getElementById('copyBtn').disabled = false
  }

  function escapeHtml(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  }

  function copyRunbook() {
    if (!currentRunbook) return
    navigator.clipboard.writeText(currentRunbook).then(() => showToast('⎘', 'Copied to clipboard'))
  }

  function setStatus(msg, type) {
    const bar = document.getElementById('statusBar')
    bar.className = `status-bar ${type}`
    bar.textContent = msg
  }

  function showToast(icon, msg) {
    document.getElementById('toastIcon').textContent = icon
    document.getElementById('toastMsg').textContent = msg
    const t = document.getElementById('toast')
    t.classList.add('show')
    setTimeout(() => t.classList.remove('show'), 3500)
  }

  document.getElementById('projectKey').addEventListener('keypress', e => {
    if (e.key === 'Enter') loadTickets()
  })
</script>
</body>
</html>
