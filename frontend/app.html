<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RunPilot — Generate Runbooks</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --green: #00e87a;
      --green-dim: #00c265;
      --bg: #080c10;
      --bg2: #0d1219;
      --bg3: #121920;
      --bg4: #161e27;
      --border: rgba(255,255,255,0.07);
      --border-green: rgba(0,232,122,0.25);
      --text: #eef2f7;
      --muted: #6b7a8d;
      --muted2: #3d4a57;
      --red: #ff5f57;
      --amber: #febc2e;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* NAV */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      background: rgba(8,12,16,0.9);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-left { display: flex; align-items: center; gap: 16px; }
    .nav-logo {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .nav-logo span { color: var(--green); }

    .nav-badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: rgba(0,232,122,0.1);
      color: var(--green);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(0,232,122,0.2);
    }

    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-link {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-link:hover { color: var(--text); }

    .status-dot {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .dot-live {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(0,232,122,0.4);} 50%{opacity:0.8;box-shadow:0 0 0 4px rgba(0,232,122,0);} }

    /* LAYOUT */
    .app-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      min-height: calc(100vh - 57px);
    }

    /* SIDEBAR */
    .sidebar {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: var(--bg2);
    }

    .sidebar-section {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted2);
      margin-bottom: 0.75rem;
    }

    .project-input-wrap {
      display: flex;
      gap: 8px;
    }

    .project-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--text);
      font-size: 13px;
      font-family: 'DM Mono', monospace;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s;
      letter-spacing: 0.05em;
    }
    .project-input:focus { border-color: var(--border-green); }
    .project-input::placeholder { color: var(--muted2); font-weight: 400; letter-spacing: 0; }

    .fetch-btn {
      background: var(--green);
      color: #080c10;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .fetch-btn:hover { background: var(--green-dim); }
    .fetch-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* TICKETS */
    .tickets-wrap { flex: 1; overflow-y: auto; padding: 0.75rem; }

    .tickets-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.5rem 0.75rem;
    }
    .tickets-count { font-size: 12px; color: var(--muted); }
    .tickets-filter {
      font-size: 11px;
      color: var(--green);
      cursor: pointer;
      background: none;
      border: none;
      font-family: 'DM Sans', sans-serif;
      transition: opacity 0.2s;
    }
    .tickets-filter:hover { opacity: 0.7; }

    .ticket-item {
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 4px;
      border: 1px solid transparent;
      position: relative;
    }
    .ticket-item:hover {
      background: var(--bg3);
      border-color: var(--border);
    }
    .ticket-item.selected {
      background: rgba(0,232,122,0.06);
      border-color: var(--border-green);
    }
    .ticket-item.selected::before {
      content: '';
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: var(--green);
      border-radius: 2px;
    }

    .ticket-key {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--green);
      font-weight: 500;
      margin-bottom: 4px;
      letter-spacing: 0.04em;
    }
    .ticket-title {
      font-size: 13px;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 6px;
      font-weight: 400;
    }
    .ticket-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 100px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .status-done { background: rgba(0,232,122,0.1); color: var(--green); }
    .status-done::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--green); }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }
    .empty-icon { font-size: 32px; margin-bottom: 0.75rem; opacity: 0.5; }
    .empty-text { font-size: 13px; line-height: 1.6; }

    /* LOADING SKELETON */
    .skeleton {
      background: linear-gradient(90deg, var(--bg3) 25%, var(--bg4) 50%, var(--bg3) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
    }
    @keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

    /* MAIN PANEL */
    .main-panel {
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .main-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-wrap: wrap;
    }

    .selected-ticket-info {
      flex: 1;
      min-width: 0;
    }
    .selected-label { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
    .selected-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .selected-placeholder { font-size: 13px; color: var(--muted2); font-style: italic; }

    .toolbar-actions { display: flex; gap: 8px; align-items: center; }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      white-space: nowrap;
    }
    .action-btn:hover { background: var(--bg3); border-color: rgba(255,255,255,0.12); }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .action-btn.primary {
      background: var(--green);
      color: #080c10;
      border-color: transparent;
      font-weight: 600;
    }
    .action-btn.primary:hover { background: var(--green-dim); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,232,122,0.2); }
    .action-btn.primary:disabled { background: var(--green); opacity: 0.4; transform: none; box-shadow: none; }

    /* OUTPUT AREA */
    .output-area {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
    }

    .output-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 400px;
      text-align: center;
      gap: 1rem;
    }
    .placeholder-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: var(--bg2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .placeholder-title { font-size: 16px; font-weight: 500; color: var(--text); }
    .placeholder-sub { font-size: 13px; color: var(--muted); max-width: 300px; line-height: 1.6; }

    /* RUNBOOK DISPLAY */
    .runbook-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      max-width: 860px;
      margin: 0 auto;
    }

    .runbook-card-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      background: var(--bg3);
    }

    .runbook-meta { flex: 1; min-width: 0; }
    .runbook-ticket-key {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--green);
      font-weight: 500;
      margin-bottom: 4px;
      letter-spacing: 0.04em;
    }
    .runbook-title-display {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
      line-height: 1.3;
    }

    .runbook-actions { display: flex; gap: 8px; flex-shrink: 0; }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--bg4);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      color: var(--muted);
    }
    .icon-btn:hover { background: var(--bg3); border-color: rgba(255,255,255,0.12); color: var(--text); }

    .confluence-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--green);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(0,232,122,0.2);
      background: rgba(0,232,122,0.06);
      transition: all 0.2s;
      white-space: nowrap;
    }
    .confluence-link:hover { background: rgba(0,232,122,0.1); border-color: rgba(0,232,122,0.3); }

    .runbook-body {
      padding: 1.5rem;
      font-family: 'DM Mono', monospace;
      font-size: 12.5px;
      line-height: 1.8;
      color: #c9d1d9;
      white-space: pre-wrap;
      max-height: 600px;
      overflow-y: auto;
    }
    .runbook-body::-webkit-scrollbar { width: 4px; }
    .runbook-body::-webkit-scrollbar-track { background: transparent; }
    .runbook-body::-webkit-scrollbar-thumb { background: var(--muted2); border-radius: 2px; }

    .runbook-footer {
      padding: 0.75rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg3);
    }
    .runbook-saved { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }
    .runbook-timestamp { font-size: 11px; color: var(--muted2); }

    /* LOADING STATE */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 400px;
      gap: 1rem;
    }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 2px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: var(--muted); }
    .loading-sub { font-size: 12px; color: var(--muted2); }

    /* STATUS BAR */
    .status-bar {
      padding: 0.6rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      background: var(--bg2);
      min-height: 36px;
    }
    .status-bar.success { color: var(--green); }
    .status-bar.error { color: #ff6b6b; }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg3);
      border: 1px solid var(--border-green);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 1000;
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s;
      max-width: 320px;
    }
    .toast.show { transform: none; opacity: 1; }
    .toast-icon { font-size: 16px; flex-shrink: 0; }

    @media (max-width: 768px) {
      .app-layout { grid-template-columns: 1fr; }
      .sidebar { max-height: 300px; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-left">
    <a href="landing.html" class="nav-logo">Run<span>Pilot</span></a>
    <span class="nav-badge">Beta</span>
  </div>
  <div class="nav-right">
    <div class="status-dot">
      <div class="dot-live"></div>
      <span>API live</span>
    </div>
    <a href="landing.html" class="nav-link">← Back to home</a>
  </div>
</nav>

<div class="app-layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Jira project</div>
      <div class="project-input-wrap">
        <input type="text" id="projectKey" class="project-input" placeholder="e.g. PROJ" value="PROJ" />
        <button class="fetch-btn" onclick="loadTickets()" id="fetchBtn">Fetch</button>
      </div>
    </div>

    <div class="tickets-wrap" id="ticketsWrap">
      <div class="empty-state">
        <div class="empty-icon">🎫</div>
        <div class="empty-text">Enter your Jira project key<br/>and click Fetch to load tickets</div>
      </div>
    </div>

    <div style="padding: 0.75rem; border-top: 1px solid var(--border);">
      <button class="action-btn" style="width:100%; justify-content:center;" onclick="generateAll()" id="generateAllBtn">
        ⚡ Generate All Incident Runbooks
      </button>
    </div>
  </div>

  <!-- MAIN PANEL -->
  <div class="main-panel">
    <div class="main-toolbar">
      <div class="selected-ticket-info">
        <div id="selectedInfo">
          <span class="selected-placeholder">← Select a ticket to generate its runbook</span>
        </div>
      </div>
      <div class="toolbar-actions">
        <button class="action-btn" onclick="copyRunbook()" id="copyBtn" disabled>📋 Copy</button>
        <button class="action-btn primary" onclick="generateRunbook()" id="generateBtn" disabled>
          ✨ Generate Runbook
        </button>
      </div>
    </div>

    <div class="output-area" id="outputArea">
      <div class="output-placeholder" id="placeholder">
        <div class="placeholder-icon">📖</div>
        <div class="placeholder-title">No runbook generated yet</div>
        <div class="placeholder-sub">Select a ticket from the sidebar and click Generate Runbook to get started</div>
      </div>
    </div>

    <div class="status-bar" id="statusBar">
      <span>Ready</span>
    </div>
  </div>

</div>

<div class="toast" id="toast">
  <span class="toast-icon" id="toastIcon">✅</span>
  <span id="toastMsg">Copied to clipboard!</span>
</div>

<script>
  const API = 'http://35.154.77.254:8000'
  let selectedTicket = null
  let currentRunbook = ''
  let currentConfluenceUrl = ''

  async function loadTickets() {
    const key = document.getElementById('projectKey').value.trim().toUpperCase()
    if (!key) return

    const wrap = document.getElementById('ticketsWrap')
    document.getElementById('fetchBtn').disabled = true

    wrap.innerHTML = `
      <div style="padding: 1rem 0.75rem; display: flex; flex-direction: column; gap: 8px;">
        ${[1,2,3,4,5].map(() => `
          <div style="padding: 12px; border-radius: 10px; background: var(--bg3);">
            <div class="skeleton" style="height:10px; width:60px; margin-bottom:8px;"></div>
            <div class="skeleton" style="height:12px; width:100%; margin-bottom:4px;"></div>
            <div class="skeleton" style="height:12px; width:75%;"></div>
          </div>
        `).join('')}
      </div>
    `

    try {
      const res = await fetch(`${API}/tickets/${key}`)
      if (!res.ok) throw new Error('Failed')
      const data = await res.json()

      if (!data.tickets || data.tickets.length === 0) {
        wrap.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">No tickets found for project <strong>${key}</strong></div></div>`
        return
      }

      wrap.innerHTML = `
        <div class="tickets-header">
          <span class="tickets-count">${data.count} tickets</span>
        </div>
      `

      data.tickets.forEach(ticket => {
        const item = document.createElement('div')
        item.className = 'ticket-item'
        item.id = `ticket-${ticket.key}`
        item.innerHTML = `
          <div class="ticket-key">${ticket.key}</div>
          <div class="ticket-title">${ticket.summary}</div>
          <span class="ticket-status status-done">${ticket.status}</span>
        `
        item.onclick = () => selectTicket(ticket)
        wrap.appendChild(item)
      })

    } catch (e) {
      wrap.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">Could not connect to API.<br/>Make sure the server is running.</div></div>`
    } finally {
      document.getElementById('fetchBtn').disabled = false
    }
  }

  function selectTicket(ticket) {
    selectedTicket = ticket
    document.querySelectorAll('.ticket-item').forEach(el => el.classList.remove('selected'))
    const el = document.getElementById(`ticket-${ticket.key}`)
    if (el) { el.classList.add('selected'); el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }

    document.getElementById('selectedInfo').innerHTML = `
      <div class="selected-label">Selected ticket</div>
      <div class="selected-title">${ticket.key} — ${ticket.summary}</div>
    `
    document.getElementById('generateBtn').disabled = false
    setStatus('Ticket selected — click Generate Runbook to create its runbook', '')
  }

  async function generateRunbook() {
    if (!selectedTicket) return
    const projectKey = document.getElementById('projectKey').value.trim().toUpperCase()

    document.getElementById('generateBtn').disabled = true
    document.getElementById('copyBtn').disabled = true
    setStatus('Generating runbook with AI...', '')
    showLoading(`Generating runbook for ${selectedTicket.key}...`, 'This takes about 10–15 seconds')

    try {
      const res = await fetch(`${API}/generate-and-sync/${projectKey}/${selectedTicket.key}`, { method: 'POST' })
      if (!res.ok) throw new Error('Generation failed')
      const data = await res.json()

      currentRunbook = data.runbook
      currentConfluenceUrl = data.confluence_url || ''
      showRunbook(data)
      setStatus(`✓ Runbook generated and synced to Confluence`, 'success')
      showToast('✅', 'Runbook generated and saved to Confluence!')

    } catch (e) {
      setStatus('Error generating runbook. Please try again.', 'error')
      showToast('❌', 'Error generating runbook')
      document.getElementById('outputArea').innerHTML = `
        <div class="output-placeholder">
          <div class="placeholder-icon">❌</div>
          <div class="placeholder-title">Generation failed</div>
          <div class="placeholder-sub">Could not generate runbook. Check your API connection and try again.</div>
        </div>
      `
    } finally {
      document.getElementById('generateBtn').disabled = false
    }
  }

  async function generateAll() {
    const projectKey = document.getElementById('projectKey').value.trim().toUpperCase()
    if (!projectKey) { showToast('⚠️', 'Please enter a project key first'); return; }

    document.getElementById('generateAllBtn').disabled = true
    setStatus('Generating all incident runbooks... this may take 30–60 seconds', '')
    showLoading('Generating all incident runbooks...', 'Fetching tickets, generating with AI, syncing to Confluence')

    try {
      const res = await fetch(`${API}/generate-all/${projectKey}`, { method: 'POST' })
      if (!res.ok) throw new Error('Failed')
      const data = await res.json()

      if (data.runbooks && data.runbooks.length > 0) {
        currentRunbook = data.runbooks[0].runbook
        showRunbook({ ...data.runbooks[0], saved_to: data.saved_files?.[0], confluence_url: null })
        setStatus(`✓ Generated ${data.generated} runbooks successfully`, 'success')
        showToast('✅', `${data.generated} runbooks generated!`)
      }
    } catch (e) {
      setStatus('Error generating runbooks', 'error')
      showToast('❌', 'Error generating runbooks')
    } finally {
      document.getElementById('generateAllBtn').disabled = false
    }
  }

  function showLoading(text, sub) {
    document.getElementById('outputArea').innerHTML = `
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <div class="loading-text">${text}</div>
        <div class="loading-sub">${sub}</div>
      </div>
    `
  }

  function showRunbook(data) {
    const confluenceBtn = data.confluence_url
      ? `<a href="${data.confluence_url}" target="_blank" class="confluence-link">📄 View in Confluence ↗</a>`
      : ''

    document.getElementById('outputArea').innerHTML = `
      <div class="runbook-card">
        <div class="runbook-card-header">
          <div class="runbook-meta">
            <div class="runbook-ticket-key">${data.ticket_key}</div>
            <div class="runbook-title-display">${data.ticket_title}</div>
          </div>
          <div class="runbook-actions">
            ${confluenceBtn}
            <div class="icon-btn" onclick="copyRunbook()" title="Copy runbook">📋</div>
          </div>
        </div>
        <div class="runbook-body" id="runbookContent">${escapeHtml(data.runbook)}</div>
        <div class="runbook-footer">
          <div class="runbook-saved">${data.saved_to ? `Saved → ${data.saved_to}` : 'Generated successfully'}</div>
          <div class="runbook-timestamp">${new Date().toLocaleString()}</div>
        </div>
      </div>
    `
    document.getElementById('copyBtn').disabled = false
    document.getElementById('outputArea').scrollIntoView({ behavior: 'smooth' })
  }

  function escapeHtml(text) {
    return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  }

  function copyRunbook() {
    if (!currentRunbook) return
    navigator.clipboard.writeText(currentRunbook).then(() => {
      showToast('📋', 'Runbook copied to clipboard!')
    })
  }

  function setStatus(msg, type) {
    const bar = document.getElementById('statusBar')
    bar.className = `status-bar ${type}`
    bar.innerHTML = `<span>${msg}</span>`
  }

  function showToast(icon, msg) {
    const toast = document.getElementById('toast')
    document.getElementById('toastIcon').textContent = icon
    document.getElementById('toastMsg').textContent = msg
    toast.classList.add('show')
    setTimeout(() => toast.classList.remove('show'), 3500)
  }

  window.addEventListener('load', () => {
    loadTickets()
  })
</script>
</body>
</html>
